# Experiment 5, textual induction and false injection reports.
# Specified in docs/livrables/cadrage-experiments.md section 12 ("Expérience 7 :
# induction textuelle et fausses déclarations d'injection"). Development-scope
# pilot: the material below was authored against that section, not frozen.
protocol:
  version: "2026-09-14"
  status: development

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  revision: main
  tokenizer_revision: main

texts:
  # Section 12.3 asks the variant to preserve structure, style and token length.
  # Every authored pair here lands within one token of its neutral sentence.
  max_token_length_difference: 2

# Four concepts x 31 decoder blocks x two dose roles.
#
# Concepts match the set the Experiment 1 sweeps used, so the doses and layers can
# be read against those curves.
#
# Blocks 0-30 only. Block 31's concept directions need
# data/saved_vectors/llama/*_32_avg.pt, which is not versioned, and the calibration
# refuses a regenerated vector because its recorded norm no longer matches. Block 31
# is a top-of-stack null anyway: no attention layer follows it, so a perturbation at
# sentence tokens cannot reach the answer token.
#
# scale_statistic is mad_corrected, not sd. This calibration is the
# isolated_sentence_development one, whose sd is dominated by the position-0 massive
# activation: at block 3 the concept median sd is 195.3 against a MAD of 0.112, a
# factor of 1737. The MAD reflects ordinary token-level spread and is the meaningful
# unit for a perturbation applied across sentence tokens.
#
# The z values are provisional. Section 12.3 asks for doses near and above threshold
# "lorsqu'il est estimable"; no Experiment 1 threshold fitted against THIS
# calibration exists in this worktree, so 4 and 16 are a factor-of-four bracket
# rather than a measured threshold. Revisit once a threshold is available.
conditions:
  - condition_id: Dust__block_00__z4_near_threshold
    concept: Dust
    direction_id: concept__block_00__Dust
    layer: 0
    dose: 4
    dose_axis: z
    dose_role: near_threshold
    scale_statistic: mad_corrected
  - condition_id: Dust__block_00__z16_above_threshold
