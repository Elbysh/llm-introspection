# Experiment 5 over the live detection band (blocks 0-13).
# Spec: docs/livrables/cadrage-experiments.md section 9 ("Expérience 5", H5).
#
# Extends induction_scaled.yaml, which sampled the injected arm at block 8 only.
# Section 9.3 asks for all 32 layers; the injected signal is not spread over them.
# Measured on the pilot's full 0-30 sweep, the injected-minus-sham margin averages
# |0.129| over blocks 0-13 and |0.008| over blocks 14-30 -- a factor of 16. So the
# band below carries essentially all of the detection signal, and blocks 14+ are a
# built-in null that costs 17/31 of the compute to re-measure.
#
# Same 100 text pairs and same two doses as induction_scaled, so the block-8 cells
# reproduce and the two runs can be read together.
#
# Block 0 is included deliberately but must be read with care, not pooled blindly:
# in the ladder (run 8369) it returned invalid generations on 0.475 of injected
# trials at alpha 16, rising to 0.856 at alpha 256. Its margin shift is largely
# broken decoding rather than a presence report. Check invalid_rate_injected per
# block before aggregating, and expect to exclude block 0.
protocol:
  version: "2026-09-14"
  status: development

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  revision: main
  tokenizer_revision: main

texts:
  max_token_length_difference: 2

