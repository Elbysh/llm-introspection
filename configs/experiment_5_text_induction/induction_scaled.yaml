# Experiment 5, scaled textual-induction run.
# Spec: docs/livrables/cadrage-experiments.md section 12 ("Expérience 7").
#
# Three changes from development_pilot, all driven by what runs 8342 and 8369 showed.
#
# 1. STRONGER TEXTS. The pilot's variants were mild and moved the presence margin by
#    only +0.067 logits against a -3.31 baseline -- about 2% of the distance to the
#    decision boundary, which is why no discrete answer ever flipped. The 100 pairs in
#    induction_scaled.json push evocation as hard as the token budget allows. Every
#    pair still sits within 2 tokens of its neutral sentence, so length is not a
#    confound (section 12.3).
#
# 2. MORE DISTINCT PAIRS, NOT MORE REPEATS. A sham trial applies no intervention, so
#    its outcome depends only on the prompt: in the pilot all 9840 sham trials were 62
#    identical copies of 160 distinct prompts, and not one varied. Repeats add nothing.
#    10 concepts x 10 pairs gives 800 distinct sham prompts, which takes the rule-of-
#    three bound on a zero false-positive rate from 1.88% down to about 0.38%, and lets
#    the cluster bootstrap resample 10 concepts instead of 4 -- that small number of
#    concepts is what makes the pooled CI wide.
#
# 3. NO LAYER SWEEP. Layer is not an input to the primary measure at all, so sweeping
#    it multiplied cost without adding information. Block 8 is kept for the injected
#    arm only: it was the one clean probe in the ladder, with zero invalid responses at
#    every dose and a monotone margin. Block 0 is avoided on purpose -- its large
#    apparent effect was mostly broken generation (86% invalid at alpha 256).
#
# Doses are alpha 128 and 256, the top of the ladder, where block 8 reached its best
# hit rate (0.125). The role labels are the schema's required enum, not measured
# thresholds. Expect the discrete false-positive rate to stay at zero; the deliverable
# is a tight bounded null on that rate plus the continuous margin estimate.
