# Experiment 5, section 9 of cadrage-experiments-new.md.
# Copy this file for a real run and replace every empty selection.
protocol:
  version: "2026-09-14"
  status: development

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  revision: main
  tokenizer_revision: main

texts:
  # Maximum allowed absolute token-count difference between the two versions.
  # Set null only if length matching is intentionally disabled and documented.
  max_token_length_difference: 2

# Add the concept directions, layers and positive doses chosen for the run.
# Dropout, random directions and renewed noise do not belong to Experiment 5.
conditions: []

statistics:
  bootstrap_resamples: 1000
  bootstrap_seed: 2026091405
  ci_level: 0.95

execution:
  dtype: bfloat16

paths:
  text_pairs: configs/experiment_5_text_induction/text_pairs.template.json
  directional_scales: results/experiment_0_calibration/directional_scales.json
  calibration_manifest: results/experiment_0_calibration/run_manifest.json
  plan_dir: data/experiment_5_text_induction/plans/TO_SET
  output_dir: results/experiment_5_text_induction/TO_SET
  analysis_dir: results/experiment_5_text_induction/TO_SET_analysis
