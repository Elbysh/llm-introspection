# Experiment 5 dose ladder: locate where the discrete presence report lifts off
# the floor, so a real run can set near/above threshold doses from measurement.
#
# The development_pilot run (job 8342) returned false_positive_rate 0.000 in all
# 496 summary rows and hit_rate nonzero in only 3, all at block 0. Its alphas were
# 0.27-28.5. The injection was live there (injected-minus-sham margin nonzero in
# 465/496 conditions, +1.17 at block 0), so the doses, not the plumbing, were the
# limit. This ladder walks alpha up to 256, one step past the top of the grid the
# Llama Experiment 1 sweep used (--alpha_doses 0.25 ... 128).
#
# dose_axis is alpha, not z: mad_corrected ranges 0.1 to 6.2 across blocks, so a
# fixed z buys very different amplitudes at different depths and is a poor unit for
# comparing blocks. scale_statistic is still recorded but does not scale the dose.
#
# Blocks 0/3/8/13: block 0 is the positive control (the only block that moved in the
# pilot), the rest sample the band Experiment 1 found live on Llama.
protocol:
  version: "2026-09-14"
  status: development

model:
  name: meta-llama/Llama-3.1-8B-Instruct
  revision: main
  tokenizer_revision: main

